spring.application.name=GymErp

# 포트 번호 설정
server.port=9000

# === 데이터베이스(Oracle) 설정 ===
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@3.34.86.79:1521:xe
spring.datasource.username=gymerp
spring.datasource.password=1234
#spring.datasource.url=jdbc:oracle:thin:@43.203.95.181:1521:xe
#spring.datasource.username=acorn
#spring.datasource.password=1234

# === MyBatis 설정 ===
# 매퍼 XML 파일 위치 (resources/mapper/*.xml)
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# @Alias 등이 선언된 클래스 패키지 (하위 패키지까지 스캔)
mybatis.type-aliases-package=com.example.gymerp.**

# 컬럼명 스네이크케이스 → 필드 카멜케이스 자동 매핑 (ex: EMP_NAME -> empName)
mybatis.configuration.map-underscore-to-camel-case=true

# 콘솔에 실행되는 SQL 로그 출력 (디버깅용)
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# === 파일 업로드 제한 ===
# 개별 파일의 최대 크기
spring.servlet.multipart.max-file-size=50MB
# 요청 전체의 최대 크기(파일 + 폼 필드 포함)
spring.servlet.multipart.max-request-size=60MB

#-----------------11월11일 추가------------------------
# Nginx의 X-Forwarded-* 반영(https 인식)
server.forward-headers-strategy=framework

# 세션 쿠키를 https에서만/동일 도메인에서 작동
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
#---------------------------------------------------


# ================시간대 영국에서 한국으로 변환되게 수정함 ===============
spring.jackson.time-zone=Asia/Seoul




# ====================== 🎯 로그 정책 ======================

logging.level.root=INFO
logging.level.org.mybatis=WARN
logging.level.org.mybatis.spring=WARN
logging.level.org.apache.ibatis=WARN
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.transaction=INFO
# 로그 파일 저장 경로
logging.file.name=/app/logs/gymerp.log
# 파일 최대 크기 (기본 10MB, 초과하면 새 파일 생성)
logging.logback.rollingpolicy.max-file-size=10MB
# 전체 로그 최대 100MB
logging.logback.rollingpolicy.total-size-cap=100MB

# ==========================================
# DB 쿼리 로그 출력 설정 (포트폴리오 캡처용)
# ==========================================

